# Daily keep-alive so the free-tier Supabase project is never idle for 7 days
# (Supabase auto-pauses inactive free projects). Backs up the Vercel cron in
# vercel.json, which is deprecated and showed no invocations.
#
# 1. Hits /api/keepalive on the live site (runs one real DB query via Prisma).
# 2. If the SUPABASE_URL + SUPABASE_ANON_KEY repo secrets are set, also calls the
#    Supabase API directly, which Supabase counts as project activity.
name: Keep-alive

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch: # allow manual runs from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping site keep-alive endpoint (DB query)
        run: |
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 60 \
            https://kotfilm-iota.vercel.app/api/keepalive
          echo

      - name: Ping Supabase API (optional)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets not set; skipping direct API ping."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 60 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/auth/v1/health"
          echo
